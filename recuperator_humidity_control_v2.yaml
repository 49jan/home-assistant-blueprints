Logika za avtomatizacijo rekuperatorja (nadzor vlage)
1. Osnovni princip
Rekuperator naj deluje le takrat, ko ventiliranje dejansko zniža notranjo vlago – ne pa vsakič, ko je notranja vlaga visoka. To je ključna točka, ki jo veliko avtomatizacij naredi narobe.

Pomembno: primerjava relativne vlažnosti (RH%) med notranjostjo in zunanjostjo je zavajajoča, ker je RH% odvisna od temperature. Pravilneje je primerjati absolutno vlago (g/m³) ali rosišče (dew point) – ker le to pove, ali zunanji zrak dejansko vsebuje manj vodne pare kot notranji.

Primer: zunaj je 5°C in 90% RH, notri 21°C in 55% RH → po RH% bi rekli "zunaj je bolj vlažno, ne prezračuj". V resnici pa ima ta hladen zrak veliko manj vodne pare (absolutno), zato bi prezračevanje znižalo notranjo vlago. Klasična napaka.
Torej priporočam izračunati absolutno vlago (ali rosišče) iz temperature + RH% za obe strani, in primerjati to.

Če ti je to preveč zapleteno/ne želiš dodatnega template senzorja, lahko uporabimo poenostavljeno različico (primerjava RH% z varnostno rezervo), a bo manj natančna – to je stvar odločitve, ne napaka.

2. Potrebni vhodni podatki (entitete)
sensor.notranja_vlaga (RH%)
sensor.zunanja_vlaga (RH%)
sensor.notranja_temp
sensor.zunanja_temp
(opcijsko, izračunano) sensor.notranja_absolutna_vlaga, sensor.zunanja_absolutna_vlaga
3. Pogoji za VKLOP prezračevanja
Rekuperator naj se vklopi, ko so izpolnjeni VSI pogoji:

Notranja vlaga > nastavljen prag (npr. 60%) — histereza za izklop pri npr. 55%, da se ne cika.
Zunanji zrak je "suši" od notranjega za vsaj neko rezervo (absolutna vlaga zunaj < absolutna vlaga notri – margin, ali poenostavljeno: zunanja RH% < notranja RH% – margin).
Zunanja temperatura je znotraj dovoljenega razpona (glej spodaj).
4. Temperaturne omejitve
Tehnično rekuperatorju (predvsem tistemu s toplotno izmenjavo) mraz/vročina ne škodi – ampak:

Pri zelo nizkih zunanjih temperaturah (npr. pod -15°C) lahko pride do zmrzovanja izmenjevalnika pri nekaterih modelih (odvisno od naprave – pri pravem rekuperatorju s celico ponavadi ni problema, pri enostavnem prezračevalnem ventilatorju brez izmenjave pa boš izgubljal ogromno toplote).
Pri zelo visokih zunanjih temperaturah poleti ventiliranje lahko dodatno segreva prostor (ni nujno problem za vlago, je pa za udobje).
Predlog: nastaviva min/max mejo zunanje temperature (npr. -15°C in 35°C) kot varovalko, ki jo lahko po potrebi izklopiš/prilagodiš – ne bo pa to primarni pogoj, ampak "override" zaščita.

5. Ločena obravnava dveh tipov naprav
Tip A (fan z nastavljivo hitrostjo): lahko dodamo stopnjevanje moči glede na razliko vlage (npr. razlika 5–10% → nizka hitrost, >15% → visoka hitrost).
Tip B (switch on/off): samo binarni vklop/izklop po istih pogojih, brez modulacije moči.
To pomeni: en skupen "odločevalni" blok (kdaj sploh prezračevati) + ločena "izvedbena" veja za vsak tip naprave (choose v Home Assistantu, glede na domain naprave – fan vs switch).

6. Histereza (da se ne vklaplja/izklaplja prepogosto)
Vklop pri notranji vlagi > 60%
Izklop pri notranji vlagi < 55%
Minimalen čas delovanja (npr. 10 min) in minimalen čas premora med cikli, da motor ne "trza".
7. Struktura predlagane rešitve
(Opcijsko) Template senzorja za absolutno vlago notri/zunaj.
En glavni automation (ali dva – trigger na spremembo vlage + periodičen time pattern check).
choose/if-then veja glede na tip naprave (fan vs switch), z uporabo input_select ali direktno preverjanje domene entitete.
Input helperji (input_number) za pragove, da jih lahko spreminjaš brez urejanja YAML: prag vklop/izklop vlage, margin med notranjo/zunanjo, min/max temp.
Preden grem pisat YAML: mi lahko poveš:

Ali želiš natančno (absolutna vlaga/rosišče) ali poenostavljeno (RH% primerjava) logiko?
Točna imena/entity_id senzorjev in obeh naprav (fan + switch)?
Kakšne mejne temperature želiš (privzeto predlagam -15°C / 35°C)?
dajva natančno absolutno vlago
Če narediva template, kiga uvozim iz github kot automation, verjetno so lahko potem ta imena senzorjev nastavljiva?
