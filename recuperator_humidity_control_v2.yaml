Recuperator humidity control · YAML
blueprint:
  name: Recuperator / HRV Humidity-Based Control (v2)
  description: >
    Controls a heat-recovery ventilator (recuperator) based on **absolute humidity**
    comparison between indoor and outdoor air, not just relative humidity (%).
 
    Why absolute humidity? Relative humidity (%) alone is misleading: cold outdoor
    air can show a high RH% while actually holding far less water vapor than warm
    indoor air. This blueprint converts both indoor and outdoor temperature + RH%
    into absolute humidity (g/m³) and only ventilates when outdoor air is genuinely
    "drier" than indoor air by a configurable margin.
 
    Supports two device types:
      - **Variable fan** (fan.* entity with adjustable speed/percentage) — speed
        is scaled based on how large the humidity difference is.
      - **On/off device** (switch.* or light.* entity) — simple on/off control.
 
    Includes an outdoor temperature safety range (default -15°C to 35°C) to avoid
    running the unit in extreme conditions, and hysteresis thresholds to prevent
    short-cycling.
 
    Repository: https://github.com/49jan/home-assistant-blueprints
  domain: automation
  source_url: https://raw.githubusercontent.com/49jan/home-assistant-blueprints/main/automation/recuperator_humidity_control.yaml
  input:
    indoor_humidity_sensor:
      name: Indoor Humidity Sensor
      description: Sensor reporting indoor relative humidity (%).
      selector:
        entity:
          domain: sensor
          device_class: humidity
 
    outdoor_humidity_sensor:
      name: Outdoor Humidity Sensor
      description: Sensor reporting outdoor relative humidity (%).
      selector:
        entity:
          domain: sensor
          device_class: humidity
 
    indoor_temp_sensor:
      name: Indoor Temperature Sensor
      selector:
        entity:
          domain: sensor
          device_class: temperature
 
    outdoor_temp_sensor:
      name: Outdoor Temperature Sensor
      selector:
        entity:
          domain: sensor
          device_class: temperature
 
    ventilation_device:
      name: Recuperator / Ventilation Device
      description: >
        The fan, switch, or light entity that controls the recuperator.
        Must match the "Device Type" selected below.
      selector:
        entity:
          domain:
            - fan
            - switch
            - light
 
    device_type:
      name: Device Type
      description: >
        Choose "Variable fan" if the device supports adjustable speed
        (fan.turn_on / fan.set_percentage), or "On/off device" if it only
        supports on/off — this covers both switch.* and light.* entities,
        since Home Assistant's generic homeassistant.turn_on/turn_off
        services work for either domain.
      default: variable_fan
      selector:
        select:
          mode: dropdown
          options:
            - label: Variable speed fan (fan.* entity)
              value: variable_fan
            - label: Simple on/off device (switch.* or light.* entity)
              value: onoff_device
 
    humidity_on_threshold:
      name: Indoor Humidity ON Threshold (%)
      description: Ventilation turns on when indoor humidity rises above this value.
      default: 60
      selector:
        number:
          min: 30
          max: 90
          step: 1
          unit_of_measurement: "%"
          mode: box
 
    humidity_off_threshold:
      name: Indoor Humidity OFF Threshold (%)
      description: >
        Ventilation turns off when indoor humidity drops below this value.
        Must be lower than the ON threshold to create hysteresis and avoid
        short-cycling.
      default: 55
      selector:
        number:
          min: 20
          max: 90
          step: 1
          unit_of_measurement: "%"
          mode: box
 
    absolute_humidity_margin:
      name: Absolute Humidity Margin (g/m³)
      description: >
        Minimum required difference between indoor and outdoor absolute
        humidity before ventilation is allowed to start. Higher values make
        the automation more conservative (only ventilates when clearly
        beneficial).
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 5
          step: 0.1
          unit_of_measurement: "g/m³"
          mode: box
 
    min_outdoor_temp:
      name: Minimum Outdoor Temperature (°C)
      description: >
        Below this temperature, ventilation is forced off regardless of
        humidity (safety limit, e.g. to avoid excessive heat loss or
        potential frost issues on simple units).
      default: -15
      selector:
        number:
          min: -30
          max: 15
          step: 1
          unit_of_measurement: "°C"
          mode: box
 
    max_outdoor_temp:
      name: Maximum Outdoor Temperature (°C)
      description: Above this temperature, ventilation is forced off regardless of humidity.
      default: 35
      selector:
        number:
          min: 20
          max: 45
          step: 1
          unit_of_measurement: "°C"
          mode: box
 
    fan_speed_low:
      name: Fan Speed - Low (%)
      description: Speed used when the humidity difference is small (variable fan only).
      default: 33
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
 
    fan_speed_medium:
      name: Fan Speed - Medium (%)
      description: Speed used when the humidity difference is moderate (variable fan only).
      default: 66
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
 
    fan_speed_high:
      name: Fan Speed - High (%)
      description: Speed used when the humidity difference is large (variable fan only).
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
 
    check_interval_minutes:
      name: Periodic Check Interval (minutes)
      description: >
        In addition to reacting to sensor changes, the automation
        re-evaluates on this fixed interval as a safety net.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
          mode: box
 
trigger:
  - platform: time_pattern
    minutes: !input check_interval_minutes
  - platform: state
    entity_id: !input indoor_humidity_sensor
  - platform: state
    entity_id: !input outdoor_humidity_sensor
  - platform: state
    entity_id: !input outdoor_temp_sensor
 
variables:
  indoor_humidity_sensor: !input indoor_humidity_sensor
  outdoor_humidity_sensor: !input outdoor_humidity_sensor
  indoor_temp_sensor: !input indoor_temp_sensor
  outdoor_temp_sensor: !input outdoor_temp_sensor
  ventilation_device: !input ventilation_device
  device_type: !input device_type
  humidity_on_threshold: !input humidity_on_threshold
  humidity_off_threshold: !input humidity_off_threshold
  ah_margin: !input absolute_humidity_margin
  min_outdoor_temp: !input min_outdoor_temp
  max_outdoor_temp: !input max_outdoor_temp
  fan_speed_low: !input fan_speed_low
  fan_speed_medium: !input fan_speed_medium
  fan_speed_high: !input fan_speed_high
 
  indoor_rh: "{{ states(indoor_humidity_sensor) | float(0) }}"
  outdoor_rh: "{{ states(outdoor_humidity_sensor) | float(0) }}"
  indoor_t: "{{ states(indoor_temp_sensor) | float(0) }}"
  outdoor_t: "{{ states(outdoor_temp_sensor) | float(0) }}"
 
  # Absolute humidity (g/m3) via Magnus-Tetens approximation
  indoor_ah: >-
    {% set t = indoor_t %}
    {% set rh = indoor_rh %}
    {{ (6.112 * exp((17.67 * t) / (t + 243.5)) * rh * 2.1674 / (273.15 + t)) | round(2) }}
  outdoor_ah: >-
    {% set t = outdoor_t %}
    {% set rh = outdoor_rh %}
    {{ (6.112 * exp((17.67 * t) / (t + 243.5)) * rh * 2.1674 / (273.15 + t)) | round(2) }}
 
  ah_diff: "{{ (indoor_ah | float - outdoor_ah | float) | round(2) }}"
  temp_ok: "{{ outdoor_t >= min_outdoor_temp and outdoor_t <= max_outdoor_temp }}"
 
  should_ventilate: >-
    {{ temp_ok and indoor_rh >= humidity_on_threshold and ah_diff >= ah_margin }}
  should_stop: >-
    {{ not temp_ok or indoor_rh <= humidity_off_threshold or ah_diff < ah_margin }}
 
action:
  - choose:
      # 1) Safety: outdoor temperature outside allowed range -> force off
      - conditions: "{{ not temp_ok }}"
        sequence:
          - choose:
              - conditions: "{{ device_type == 'variable_fan' }}"
                sequence:
                  - action: fan.turn_off
                    target:
                      entity_id: "{{ ventilation_device }}"
              - conditions: "{{ device_type == 'onoff_device' }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ ventilation_device }}"
 
      # 2) Conditions favor ventilation -> turn on (with speed tiering for fans)
      - conditions: "{{ should_ventilate }}"
        sequence:
          - choose:
              - conditions: "{{ device_type == 'variable_fan' }}"
                sequence:
                  - choose:
                      - conditions: "{{ ah_diff >= (ah_margin * 3) }}"
                        sequence:
                          - action: fan.turn_on
                            target:
                              entity_id: "{{ ventilation_device }}"
                            data:
                              percentage: "{{ fan_speed_high }}"
                      - conditions: "{{ ah_diff >= (ah_margin * 1.5) }}"
                        sequence:
                          - action: fan.turn_on
                            target:
                              entity_id: "{{ ventilation_device }}"
                            data:
                              percentage: "{{ fan_speed_medium }}"
                    default:
                      - action: fan.turn_on
                        target:
                          entity_id: "{{ ventilation_device }}"
                        data:
                          percentage: "{{ fan_speed_low }}"
              - conditions: "{{ device_type == 'onoff_device' }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ ventilation_device }}"
 
      # 3) Conditions favor stopping -> turn off
      - conditions: "{{ should_stop }}"
        sequence:
          - choose:
              - conditions: "{{ device_type == 'variable_fan' }}"
                sequence:
                  - action: fan.turn_off
                    target:
                      entity_id: "{{ ventilation_device }}"
              - conditions: "{{ device_type == 'onoff_device' }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ ventilation_device }}"
 
    # 4) Neither should_ventilate nor should_stop -> hysteresis "hold" zone,
    #    keep current state, do nothing.
    default: []
 
mode: single
max_exceeded: silent
 
